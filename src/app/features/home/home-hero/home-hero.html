<!-- ========================================================
     HERO  (3-image draggable slider, text in the four corners)
     Endless loop: a copy of slide 1 sits after slide 3. When the
     slider reaches that copy it jumps back to the real slide 1
     instantly, so the loop looks continuous.

     During a festival, ONLY the festival banner is shown (the original photos
     are hidden) and the text changes to match (see festival-hero.ts).
======================================================== -->

<section class="home-hero" [class.is-festival]="!!content().festivalName">

  <!-- Auto-play timer: an invisible element whose CSS animation repeats every 2s.
       Each repeat moves the slider to the next image. -->
  <span
    class="hero-timer"
    aria-hidden="true"
    (animationiteration)="heroTrack.scrollBy({ left: heroTrack.clientWidth, behavior: 'smooth' })"
  ></span>

  <!-- Draggable banner: drag with the mouse, swipe on a phone, or use the dots.
       No TypeScript needed: everything below works from this template alone. -->
  <div class="hero-slides">
    <div
      #heroTrack
      class="hero-track"
      role="region"
      aria-label="Banner images"
      tabindex="0"
      (mousemove)="$event.buttons === 1 && heroTrack.scrollBy({ left: -$event.movementX })"
      (scroll)="heroTrack.scrollLeft >= heroTrack.clientWidth * 3 - 2 ? heroTrack.scrollTo({ left: 0, behavior: 'instant' }) : null; heroCount.textContent = heroTrack.scrollLeft < heroTrack.clientWidth * 0.5 ? '01 / 03' : (heroTrack.scrollLeft < heroTrack.clientWidth * 1.5 ? '02 / 03' : (heroTrack.scrollLeft < heroTrack.clientWidth * 2.5 ? '03 / 03' : '01 / 03')); heroDot1.classList.toggle('is-active', heroTrack.scrollLeft < heroTrack.clientWidth * 0.5 || heroTrack.scrollLeft >= heroTrack.clientWidth * 2.5); heroDot2.classList.toggle('is-active', heroTrack.scrollLeft >= heroTrack.clientWidth * 0.5 && heroTrack.scrollLeft < heroTrack.clientWidth * 1.5); heroDot3.classList.toggle('is-active', heroTrack.scrollLeft >= heroTrack.clientWidth * 1.5 && heroTrack.scrollLeft < heroTrack.clientWidth * 2.5)"
    >

      <!-- SLIDE 1 (festival banner during a festival, otherwise the normal photo) -->
      <div class="hero-slide">
        @if (art(); as festivalArt) {
          <img
            draggable="false"
            [src]="festivalArt"
            [alt]="content().festivalName + ' festival banner'"
            fetchpriority="high"
            loading="eager"
            decoding="async"
            width="1200"
            height="1500"
          />
        } @else {
          <picture>
            <source
              media="(max-width: 680px)"
              srcset="/Home%20banner%20img%209-16/1st_img%289_16%29.jpg"
            />
            <img
              draggable="false"
              src="/Home%20banner%20img%209-16/1st_img%283_4%29.png"
              alt="A carefully crafted rug in a warm, contemporary living room"
              fetchpriority="high"
              loading="eager"
              decoding="async"
              width="1200"
              height="1500"
            />
          </picture>
        }
      </div>

      <!-- SLIDES 2, 3 and the loop copy: only for the normal hero.
           During a festival the original photos are hidden. -->
      @if (!art()) {
        <!-- SLIDE 2 -->
        <div class="hero-slide">
          <picture>
            <source
              media="(max-width: 680px)"
              srcset="/Home%20banner%20img%209-16/2nd_img%289_16%29.jpg"
            />
            <img
              draggable="false"
              src="/Home%20banner%20img%209-16/2nd_img%283_4%29.png"
              alt="A handcrafted carpet styled in a considered interior"
              loading="eager"
              decoding="async"
              width="1200"
              height="1500"
            />
          </picture>
        </div>

        <!-- SLIDE 3 -->
        <div class="hero-slide">
          <picture>
            <source
              media="(max-width: 680px)"
              srcset="/Home%20banner%20img%209-16/3rd_img%289_16%29.jpg"
            />
            <img
              draggable="false"
              src="/Home%20banner%20img%209-16/3rd_img%283_4%29.png"
              alt="A detailed carpet bringing warmth to a contemporary space"
              loading="eager"
              decoding="async"
              width="1200"
              height="1500"
            />
          </picture>
        </div>

        <!-- LOOP COPY of slide 1 (hidden from screen readers).
             Reaching this copy triggers the instant jump back to the real slide 1. -->
        <div class="hero-slide" aria-hidden="true">
          <picture>
            <source
              media="(max-width: 680px)"
              srcset="/Home%20banner%20img%209-16/1st_img%289_16%29.jpg"
            />
            <img
              draggable="false"
              src="/Home%20banner%20img%209-16/1st_img%283_4%29.png"
              alt=""
              loading="eager"
              decoding="async"
              width="1200"
              height="1500"
            />
          </picture>
        </div>

      }

    </div>
  </div>

  <!-- Text is placed in the four corners so the photos stay visible -->
  <div class="hero-layout">

    <!-- TOP LEFT -->
    <div class="hero-corner hero-tl">
      <p class="hero-eyebrow">{{ eyebrow() }}</p>
    </div>

    <!-- TOP RIGHT -->
    <div class="hero-corner hero-tr">
      <div class="hero-image-stamp">{{ content().stamp[0] }}<br />{{ content().stamp[1] }}</div>
    </div>

    <!-- BOTTOM LEFT -->
    <div class="hero-corner hero-copy hero-bl">
      <h1>
        {{ content().headline }}<br />
        <span>{{ content().subheadline }}</span>
      </h1>
      <div class="hero-actions">
        <a routerLink="/shop" fragment="catalog" class="hero-primary">{{ primaryCta() }} <span aria-hidden="true">→</span></a>
        <a routerLink="/custom-requirement" class="hero-secondary">Customise your carpet</a>
      </div>
    </div>

    <!-- BOTTOM RIGHT -->
    <div class="hero-corner hero-br">
      <div class="hero-dots" [style.display]="art() ? 'none' : null">
        <button #heroDot1 type="button" class="hero-dot is-active" aria-label="Show banner image 1" (click)="heroTrack.scrollTo({ left: heroTrack.clientWidth * 0, behavior: 'smooth' })"></button>
        <button #heroDot2 type="button" class="hero-dot" aria-label="Show banner image 2" (click)="heroTrack.scrollTo({ left: heroTrack.clientWidth * 1, behavior: 'smooth' })"></button>
        <button #heroDot3 type="button" class="hero-dot" aria-label="Show banner image 3" (click)="heroTrack.scrollTo({ left: heroTrack.clientWidth * 2, behavior: 'smooth' })"></button>
      </div>
      <div class="hero-note"><span></span> Made in India · Made for spaces worldwide</div>
      <div class="hero-image-caption">
        <span>{{ content().caption }}</span>
        <span #heroCount class="hero-count" aria-hidden="true" [style.display]="art() ? 'none' : null">01 / 03</span>
      </div>
    </div>

  </div>
</section>
