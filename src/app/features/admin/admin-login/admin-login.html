<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <a class="brand" routerLink="/" aria-label="Soft Steps Carpets and Rugs home">
      <span class="brand-mark" aria-hidden="true">SS</span>
      <span class="brand-copy">
        <strong>Soft Steps</strong>
        <small>CARPETS &amp; RUGS</small>
      </span>
    </a>

    <div class="login-intro">
      <p class="eyebrow">Administrator access</p>
      <h1 id="login-title">Welcome back</h1>
      <p>Sign in to manage business communications.</p>
    </div>

    <form (ngSubmit)="signIn()" #loginForm="ngForm" [class.is-verifying]="isSubmitting">
      <div class="field-group">
        <label for="admin-email">Email address</label>
        <input
          id="admin-email"
          name="email"
          type="email"
          autocomplete="username"
          [(ngModel)]="email"
          required
          email
          placeholder="name@company.com"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="field-group">
        <label for="admin-password">Password</label>
        <div class="password-field">
          <input
            id="admin-password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            required
            placeholder="Enter your password"
            [disabled]="isSubmitting"
          />
          <button
            type="button"
            class="visibility-button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
            [disabled]="isSubmitting"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <p class="form-error" role="alert">{{ errorMessage }}</p>
      }

      <button class="submit-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Verifying access...' : 'Sign in securely' }}
      </button>

      <!-- Decorative loader (no text): the fields gather into an orbit while signing in -->
      <div class="orbit" aria-hidden="true">
        <span class="orbit-ring"></span>
        <span class="orbit-hub"></span>
        <span class="orbit-turn">
          <span class="orbit-tile" style="--sx: -57px; --cx: 0px; --cy: -56px; --d: 0s"></span>
          <span class="orbit-tile" style="--sx: -19px; --cx: 56px; --cy: 0px; --d: 0.06s"></span>
          <span class="orbit-tile" style="--sx: 19px; --cx: 0px; --cy: 56px; --d: 0.12s"></span>
          <span class="orbit-tile" style="--sx: 57px; --cx: -56px; --cy: 0px; --d: 0.18s"></span>
        </span>
      </div>
    </form>

    <a class="back-link" routerLink="/">Return to the public website</a>
  </section>
</main>
