@if (product) {

  <article class="group overflow-hidden rounded-2xl bg-white">

    <a
      [routerLink]="['/products', product.slug]"
      class="block"
    >

      <div class="overflow-hidden rounded-2xl">
        <app-product-image
          [src]="primaryImage"
          [alt]="product.name || 'Carpet or rug'"
          aspectRatio="aspect-[4/5]"
        ></app-product-image>
      </div>

      <div class="px-1 pb-2 pt-5">

        @if (product.category?.name) {
          <p class="text-xs uppercase tracking-[0.18em] text-stone-400">
            {{ product.category?.name }}
          </p>
        }

        <h3 class="mt-2 line-clamp-2 text-base font-medium text-stone-900">
          {{ product.name }}
        </h3>

        @if (product.material?.name) {
          <p class="mt-2 text-sm text-stone-500">
            {{ product.material?.name }}
          </p>
        }

        <div class="mt-3">
          <app-price-display
            [price]="price"
            [salePrice]="salePrice"
          ></app-price-display>
        </div>

      </div>

    </a>

  </article>

}
